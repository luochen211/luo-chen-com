<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Agent 系统互动实验</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css?v=task-journey-20260819" />
  </head>
  <body>
    <header class="course-header">
      <div class="course-brand">
        <span class="course-logo">AH</span>
        <div>
          <strong>Agent 系统互动实验</strong>
          <span>先看少了什么会坏 · 再决定要不要 Agent</span>
        </div>
      </div>
      <a class="ppt-button" id="headerPptLink" href="/slides/decks/agent-harness/lessons/lesson-01/" target="_blank">
        打开对应课件 <span>↗</span>
      </a>
    </header>

    <main class="course-shell">
      <aside class="curriculum">
        <div class="curriculum-head">
          <span>INTERACTIVE LAB</span>
          <strong>互动模块</strong>
          <p>6 个互动模块，每一节都从“少了什么会坏”开始。</p>
        </div>
        <nav id="lessonList" class="lesson-list" aria-label="互动模块列表"></nav>
        <div class="curriculum-foot">
          <span>统一案例主线</span>
          <strong>500 元通勤耳机：从买错倒推系统</strong>
          <p>每一步都只追问：缺少它，会让哪一个结果失真？</p>
        </div>
      </aside>

      <section class="lesson-pane">
        <div class="lesson-scroll">
          <div class="lesson-meta">
            <span id="lessonNumber">模块 1 / 6</span>
            <a id="lessonPptLink" href="/slides/decks/agent-harness/lessons/lesson-01/?slide=2" target="_blank">第 01 课 · 课件 02—05 ↗</a>
          </div>
          <h1 id="lessonTitle"></h1>
          <p class="lesson-objective" id="lessonObjective"></p>

          <section class="teaching-block">
            <span class="block-label">少了它，会坏在哪里</span>
            <div id="conceptList" class="concept-list"></div>
          </section>

          <section class="teaching-block">
            <span class="block-label">不补上，会发生什么</span>
            <blockquote id="boundaryText"></blockquote>
          </section>

          <section class="teaching-block slide-map-block">
            <span class="block-label">这次要避免哪个后果</span>
            <ol id="slideMap" class="slide-map"></ol>
          </section>

          <section class="teaching-block takeaway-block">
            <span class="block-label">最后避免什么后果</span>
            <p id="presenterTakeaway"></p>
          </section>
        </div>

        <div class="lesson-nav">
          <button id="prevLesson" type="button">← 上一个模块</button>
          <button id="nextLesson" class="next-button" type="button">下一个模块 →</button>
        </div>
      </section>

      <section class="lab-pane">
        <header class="lab-header">
          <div>
            <span>看一个后果发生</span>
            <h2 id="experimentTitle"></h2>
          </div>
          <span class="lab-status" id="labStatus">等待操作</span>
        </header>

        <div class="proof-banner">
          <span>如果缺少它</span>
          <strong id="proofStatement"></strong>
        </div>

        <div class="lab-instruction">
          <span>让后果发生</span>
          <p id="experimentInstruction"></p>
        </div>

        <div class="experiment-workspace" id="experimentWorkspace" aria-live="polite"></div>

        <section class="audience-cues">
          <div class="audience-cues-head">
            <span>结果变化</span>
            <strong>只看缺少它之后，哪个结果变错</strong>
          </div>
          <ol id="audienceCueList"></ol>
        </section>
      </section>
    </main>

    <template id="traceStepTemplate">
      <li class="trace-step">
        <span class="trace-index"></span>
        <div>
          <strong></strong>
          <p></p>
        </div>
        <b></b>
      </li>
    </template>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
